name: ci
# Manual only: run it from the Actions tab when needed (Actions -> ci -> Run workflow).
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: docu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test            # domain tests (memory/files)
      - run: npm run test:http   # Nest + supertest + socket.io, accounts on and off
      - run: npm run test:pg     # same contracts against a real PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/docu
      - run: npm run build
